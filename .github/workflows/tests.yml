name: tests

# Tests and replay only. Collection itself is meant to run locally (see the
# README): the sportsbook endpoints are region-scoped public web endpoints, so a
# live fetch from a shared CI runner would be both unreliable and inconsiderate.
# The fixtures in tests/fixtures/raw are real captured responses, so the parsers
# are still exercised against genuine payloads here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_agent_docs.py
      - run: python -m pytest tests/ -q
